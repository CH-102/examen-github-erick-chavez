<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Libros</title>
    <!-- Vinculación con el archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Catálogo de Libros</h1>

    <div class="catalogo">

        <!-- Libro 1 -->
        <div class="libro">
            <img src="https://via.placeholder.com/150x220" alt="Cubierta de libro">
            <h3>Cien Años de Soledad</h3>
            <p>Gabriel García Márquez</p>
            <p class="precio">$18.99</p>
            <button>Comprar</button>
        </div>

        <!-- Libro 2 -->
        <div class="libro">
            <img src="https://via.placeholder.com/150x220" alt="Portada de libro">
            <h3>1984</h3>
            <p>George Orwell</p>
            <p class="precio">$14.50</p>
            <button>Comprar</button>
        </div>

        <!-- Libro 3 -->
        <div class="libro">
            <img src="https://via.placeholder.com/150x220" alt="Portada de libro">
            <h3>El Principito</h3>
            <p>Antoine de Saint-Exupéry</p>
            <p class="precio">$11.20</p>
            <button>Comprar</button>
        </div>

    </div>

</body>
</html>
